# The home server's nginx site for strena.app: it forwards everything to Strena's Caddy on port 8080.
# Copy it to /etc/nginx/sites-available/strena, link it into sites-enabled, then let certbot add HTTPS
# (see "HTTPS with a domain" in the README). certbot rewrites this file on the server, not this copy.
server {
    listen 80;
    listen [::]:80;
    server_name strena.app;

    # Item pictures can be up to 10 MB (backend/wishlists/images.py), with room for the rest of the form.
    client_max_body_size 12M;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
