# The home server: docker compose -f docker-compose.prod.yml up -d --build
# Everything is reached through Caddy on port 80 (http://<server>/). Postgres and Redis are not published
# on the host. Email goes out through the SMTP account in .env; there is no Mailpit here.
name: delibird

x-backend: &backend
  build:
    context: ./backend
  env_file: .env
  restart: unless-stopped
  volumes:
    - media:/app/media
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    <<: *backend
    # gunicorn, from the image's default command; migrations and collectstatic run first (entrypoint.sh).
    environment:
      DJANGO_DEBUG: "false"
    volumes:
      - media:/app/media
      - static:/app/staticfiles
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/', timeout=5)"
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

  worker:
    <<: *backend
    environment:
      DJANGO_DEBUG: "false"
      SKIP_MIGRATIONS: "1"
    command: celery -A config worker --loglevel=info

  beat:
    <<: *backend
    environment:
      DJANGO_DEBUG: "false"
      SKIP_MIGRATIONS: "1"
    command: celery -A config beat --loglevel=info --schedule /tmp/celerybeat-schedule

  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
      args:
        EXPO_PUBLIC_API_URL: ${APP_URL}
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - media:/srv/media:ro
      - static:/srv/django-static:ro
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  media:
  static:
